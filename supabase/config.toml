# Per-function deploy config. The notify function is called by the
# events_notify Postgres trigger via pg_net with a shared hook secret
# (x-nightjar-hook) and no Authorization header, so JWT verification is off.
# Orchestrator: deploy with `supabase functions deploy notify` from repo root
# so this file is picked up (or pass --no-verify-jwt explicitly).

[functions.notify]
verify_jwt = false

# share-view resolves public clip-share tokens for anonymous viewers of
# https://nightjar.ca/s/<token> — no Authorization header, so JWT verification
# is off. Expiry/revocation are enforced inside the function (service role).
# Orchestrator: deploy with `supabase functions deploy share-view` from repo
# root so this file is picked up (or pass --no-verify-jwt explicitly).
[functions.share-view]
verify_jwt = false

# storage-gc is poked hourly by the nightjar-storage-gc pg_cron job via pg_net
# with the x-nightjar-hook shared secret (private.app_config
# storage_gc_hook_secret) and no Authorization header, so JWT verification is
# off — same arrangement as notify. It deletes storage objects, so it stays in
# dry-run mode until STORAGE_GC_DRY_RUN is explicitly set to false.
# Orchestrator: deploy with `supabase functions deploy storage-gc` from repo
# root so this file is picked up (or pass --no-verify-jwt explicitly).
[functions.storage-gc]
verify_jwt = false
